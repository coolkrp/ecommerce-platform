_format_version: "3.0"
services:
  - name: user-service
    url: http://host.docker.internal:8082
    routes: [{ name: user-api, paths: ["/api/v1/users"] }]
  - name: product-service
    url: http://host.docker.internal:8083
    routes: [{ name: product-api, paths: ["/api/v1/products"] }]
  - name: cart-service
    url: http://host.docker.internal:8084
    routes: [{ name: cart-api, paths: ["/api/v1/cart"] }]
  - name: order-service
    url: http://host.docker.internal:8085
    routes: [{ name: order-api, paths: ["/api/v1/orders"] }]
  - name: payment-service
    url: http://host.docker.internal:8086
    routes: [{ name: payment-api, paths: ["/api/v1/payments"] }]
  - name: notification-service
    url: http://host.docker.internal:8087
    routes: [{ name: notification-api, paths: ["/api/v1/notifications"] }]
