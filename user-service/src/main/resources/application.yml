spring:
  application: { name: user-service }
  datasource: { url: jdbc:mysql://localhost:3306/ecommerce, username: root, password: root }
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
  kafka: { bootstrap-servers: localhost:9092 }
  flyway: { enabled: true }
server: { port: 8082 }
jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-please}
  expiration: 3600000
